name: risuai

services:
  risuai:
    container_name: risuai
    build:
      context: .
      args:
        VITE_RISU_LEGAL_CONFIGURED: "TRUE"
    image: risuai:server-resident
    restart: always
    environment:
      # Only the fixed resident Chromium container may claim the authoritative
      # generation executor lease.
      RISU_RUNTIME_EXECUTOR_IP: ${RISU_BROWSER_IPV4:-172.30.107.20}
      # Initializes a fresh Node volume before it is reachable and lets the
      # fixed resident enroll its device key without a hidden password dialog.
      RISU_NODE_BOOTSTRAP_PASSWORD: ${RISU_RUNTIME_PASSWORD:?Set RISU_RUNTIME_PASSWORD in .env}
      RISU_PROXY_STREAM_ACKNOWLEDGED_RETENTION_MS: ${RISU_PROXY_STREAM_ACKNOWLEDGED_RETENTION_MS:-604800000}
      RISU_PROXY_STREAM_UNACKNOWLEDGED_RETENTION_MS: ${RISU_PROXY_STREAM_UNACKNOWLEDGED_RETENTION_MS:-1209600000}
      RISU_PROXY_STREAM_MAX_TERMINAL_JOBS: ${RISU_PROXY_STREAM_MAX_TERMINAL_JOBS:-2000}
      RISU_RUNTIME_GENERATION_RETENTION_MS: ${RISU_RUNTIME_GENERATION_RETENTION_MS:-2592000000}
      RISU_RUNTIME_GENERATION_MAX_TERMINAL_COMMANDS: ${RISU_RUNTIME_GENERATION_MAX_TERMINAL_COMMANDS:-2000}
      RISU_PROXY_STREAM_MAX_RESPONSE_BYTES: ${RISU_PROXY_STREAM_MAX_RESPONSE_BYTES:-268435456}
      RISU_PROXY_STREAM_MAX_SPOOL_BYTES: ${RISU_PROXY_STREAM_MAX_SPOOL_BYTES:-2147483648}
      RISU_SAVE_MAX_BYTES: ${RISU_SAVE_MAX_BYTES:-8589934592}
      RISU_SAVE_MIN_FREE_BYTES: ${RISU_SAVE_MIN_FREE_BYTES:-1073741824}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ports:
      # Cloudflare/reverse proxy publishes the unchanged upstream UI from this
      # loopback listener. Do not expose the Node port directly to the LAN.
      - 127.0.0.1:6001:6001
    networks:
      default:
        # Chromium may retain a positive DNS result longer than a Compose app
        # recreation. Keep the app address stable across image updates.
        ipv4_address: ${RISU_APP_IPV4:-172.30.107.10}
    volumes:
      - risuai-save:/app/save
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:6001/logo_32.png').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

  browser-runtime:
    image: ${RISU_CHROMIUM_IMAGE:-ghcr.io/linuxserver/chromium:version-3d7cd855@sha256:6ad21b594a3ad1c9cf77eeac9c713e7d840927a842f706e39de8f6b64c5de6e6}
    container_name: risuai-runtime
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      risuai:
        condition: service_healthy
        # Explicit Compose updates of the app must reload the resident tab so
        # it cannot keep running an older cached upstream bundle.
        restart: true
    ports:
      - ${RISU_RUNTIME_BIND:-127.0.0.1}:${RISU_RUNTIME_PORT:-6002}:3001
    networks:
      default:
        ipv4_address: ${RISU_BROWSER_IPV4:-172.30.107.20}
    environment:
      PUID: ${RISU_RUNTIME_PUID:-1000}
      PGID: ${RISU_RUNTIME_PGID:-1000}
      TZ: ${TZ:-Asia/Seoul}
      LC_ALL: ko_KR.UTF-8
      CUSTOM_USER: ${RISU_RUNTIME_USER:-risu}
      PASSWORD: ${RISU_RUNTIME_PASSWORD:?Set RISU_RUNTIME_PASSWORD in .env}
      TITLE: RisuAI Server Runtime
      PIXELFLUX_WAYLAND: "false"
      NO_DECOR: "true"
      HARDEN_DESKTOP: "true"
      HARDEN_OPENBOX: "true"
      DISABLE_SUDO: "true"
      DISABLE_TERMINALS: "true"
      RESTART_APP: "true"
      SELKIES_ENABLE_SHARING: "false"
      SELKIES_ENABLE_COLLAB: "false"
      SELKIES_ENABLE_SHARED: "false"
      SELKIES_SECOND_SCREEN: "false"
      SELKIES_FILE_TRANSFERS: upload,download
      SELKIES_CLIPBOARD_ENABLED: "true"
      SELKIES_UI_SIDEBAR_SHOW_FILES: "true"
      SELKIES_UI_SIDEBAR_SHOW_SHARING: "false"
      SELKIES_UI_SIDEBAR_SHOW_APPS: "false"
      SELKIES_FRAMERATE: "30"
      MAX_RES: 3840x2160
      RISU_RUNTIME_READINESS_URL: http://risuai:6001/logo_32.png
      CHROME_CLI: >-
        --app=http://risuai:6001/?risu-runtime=executor
        --unsafely-treat-insecure-origin-as-secure=http://risuai:6001
        --remote-debugging-port=9222
        --no-first-run
        --no-default-browser-check
        --disable-sync
        --disable-session-crashed-bubble
        --disable-background-timer-throttling
        --disable-backgrounding-occluded-windows
        --disable-renderer-backgrounding
        --disable-features=Translate,OptimizationHints,MediaRouter
        --password-store=basic
    volumes:
      - risuai-runtime-profile:/config
      - ./server/runtime/wait-for-risuai.sh:/custom-cont-init.d/10-wait-for-risuai:ro
      - ./server/runtime/browser-healthcheck.sh:/opt/risu/browser-healthcheck.sh:ro
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "bash", "/opt/risu/browser-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

volumes:
  risuai-save:
  risuai-runtime-profile:

networks:
  default:
    ipam:
      config:
        - subnet: ${RISU_RUNTIME_SUBNET:-172.30.107.0/24}
