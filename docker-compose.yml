name: risuai

services:
  risuai:
    container_name: risuai
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 6001
      RISU_STORAGE_DRIVER: postgres
      RISU_DATABASE_URL: ${RISU_DATABASE_URL:-postgresql://${POSTGRES_USER:-risuai}:${POSTGRES_PASSWORD:-risuai_change_me}@postgres:5432/${POSTGRES_DB:-risuai}}
    ports:
      - "${RISU_PORT:-6001}:6001"
    volumes:
      - risuai-save:/app/save
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:6001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    container_name: risuai-postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-risuai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-risuai_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-risuai}
    volumes:
      - risuai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-risuai} -d ${POSTGRES_DB:-risuai}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  risuai-save:
  risuai-postgres-data:
